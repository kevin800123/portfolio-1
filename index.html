<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kevin Portfolio | 全端工程師</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <link rel="stylesheet" href="css/performance.css" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen overflow-x-hidden">
  <!-- Navbar -->
  <nav class="fixed top-0 inset-x-0 z-50 bg-slate-900/70 backdrop-blur-md border-b border-white/5">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="text-xl font-bold grad-text">Kevin.dev</a>
      <button id="navToggle" class="md:hidden text-slate-300 text-2xl btn" aria-label="選單">☰</button>
      <div class="hidden md:flex gap-6 text-sm">
        <a href="index.html" class="text-cyan-400 font-semibold">首頁</a>
        <a href="projects.html" class="hover:text-cyan-400 transition">作品集</a>
        <a href="about.html" class="hover:text-cyan-400 transition">關於我</a>
        <a href="contact.html" class="hover:text-cyan-400 transition">聯絡我</a>
        <a href="login.html" class="hover:text-cyan-400 transition">登入</a>
      </div>
    </div>
    <div id="navMobile" class="md:hidden hidden border-t border-white/5 bg-slate-900/95">
      <div class="px-6 py-4 flex flex-col gap-3 text-sm">
        <a href="index.html" class="text-cyan-400">首頁</a>
        <a href="projects.html">作品集</a>
        <a href="about.html">關於我</a>
        <a href="contact.html">聯絡我</a>
        <a href="login.html">登入</a>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero relative min-h-screen flex items-center justify-center overflow-hidden">
    <div class="hero-bg absolute inset-0 -z-10 opacity-60"
         style="background:
           radial-gradient(60% 60% at 20% 30%, rgba(34,211,238,.25), transparent 60%),
           radial-gradient(50% 50% at 80% 70%, rgba(167,139,250,.25), transparent 60%),
           radial-gradient(40% 40% at 50% 50%, rgba(244,114,182,.18), transparent 60%);"></div>

    <div class="max-w-4xl mx-auto px-6 text-center">
      <p class="text-cyan-400 tracking-widest text-sm mb-4">HELLO, I'M KEVIN</p>
      <h1 class="text-5xl md:text-7xl font-bold tracking-tight grad-text leading-tight">
        把點子<br />變成精緻的產品
      </h1>
      <p class="mt-6 text-lg md:text-xl text-slate-300">
        <span id="typewriter" class="cursor"></span>
      </p>
      <div class="mt-10 flex flex-col sm:flex-row gap-4 justify-center">
        <a href="projects.html"
           class="btn btn-anim px-8 py-3 rounded-full bg-gradient-to-r from-cyan-500 to-violet-500 text-white font-semibold shadow-lg shadow-cyan-500/30 hover:shadow-cyan-500/60 transition">
          看我的作品 →
        </a>
        <a href="contact.html"
           class="btn btn-anim px-8 py-3 rounded-full border border-white/15 text-slate-100 hover:bg-white/5 transition">
          聯絡我
        </a>
      </div>
    </div>

    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 text-slate-500 text-sm animate-bounce">↓ Scroll</div>
  </section>

  <!-- Featured Projects -->
  <section class="py-24 px-6 max-w-6xl mx-auto">
    <div class="text-center mb-14 fade-up">
      <h2 class="text-3xl md:text-5xl font-bold grad-text">精選作品</h2>
      <p class="text-slate-400 mt-3">從實作中累積的最近三件代表作</p>
    </div>

    <div id="featured" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 fade-stagger">
      <div class="text-slate-500 text-center col-span-full">載入中…</div>
    </div>

    <div class="text-center mt-14 fade-up">
      <a href="projects.html"
         class="btn btn-anim inline-block px-8 py-3 rounded-full bg-white/5 border border-white/10 hover:border-cyan-400/50 transition">
        查看全部作品 →
      </a>
    </div>
  </section>

  <!-- CTA -->
  <section class="py-24 px-6 fade-up">
    <div class="max-w-3xl mx-auto glass rounded-2xl p-10 text-center">
      <h3 class="text-2xl md:text-3xl font-bold mb-3">有專案想合作？</h3>
      <p class="text-slate-400 mb-6">無論是接案、職涯機會還是技術交流，都歡迎來聊聊。</p>
      <a href="contact.html"
         class="btn btn-anim inline-block px-8 py-3 rounded-full bg-gradient-to-r from-cyan-500 to-violet-500 font-semibold">
        寫封訊息給我
      </a>
    </div>
  </section>

  <footer class="border-t border-white/5 py-10 text-center text-slate-400 text-sm">
    <div class="flex justify-center gap-6 mb-4">
      <a href="https://github.com" class="hover:text-cyan-400">GitHub</a>
      <a href="https://linkedin.com" class="hover:text-cyan-400">LinkedIn</a>
    </div>
    <p>© 2026 Kevin Portfolio. All rights reserved.</p>
  </footer>

  <script src="js/common.js"></script>
  <script>
    // 打字機效果
    const titles = ['Full-Stack Developer', 'FastAPI · Python · TypeScript', 'UI Animation Lover'];
    const tw = document.getElementById('typewriter');
    let ti = 0, ci = 0, deleting = false;
    function tick() {
      const word = titles[ti];
      tw.textContent = word.slice(0, ci);
      if (!deleting && ci < word.length) { ci++; setTimeout(tick, 80); }
      else if (deleting && ci > 0)        { ci--; setTimeout(tick, 40); }
      else { deleting = !deleting; if (!deleting) ti = (ti + 1) % titles.length; setTimeout(tick, 1200); }
    }
    tick();

    // Hero 視差（Phase 5）
    if (window.gsap && window.ScrollTrigger && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      gsap.to('.hero-bg', {
        yPercent: -20,
        ease: 'none',
        scrollTrigger: { trigger: '.hero', start: 'top top', end: 'bottom top', scrub: true },
      });
    }

    // 載入精選作品（Phase 4 串接）
    (async () => {
      const wrap = document.getElementById('featured');
      const json = await apiGet('/api/projects');
      if (!json.success || !Array.isArray(json.data)) {
        wrap.innerHTML = '<div class="text-slate-500 text-center col-span-full">尚無作品。請啟動後端並執行 seed.py</div>';
        return;
      }
      const items = json.data.slice(0, 3);
      if (!items.length) {
        wrap.innerHTML = '<div class="text-slate-500 text-center col-span-full">尚無作品</div>';
        return;
      }
      wrap.innerHTML = items.map(p => `
        <a href="projects.html" class="glass card-hover rounded-xl overflow-hidden block">
          ${p.image_url ? `<img src="${p.image_url}" alt="${p.title}" loading="lazy" class="aspect-video object-cover">` : ''}
          <div class="p-5">
            <h3 class="font-bold text-lg mb-1">${p.title}</h3>
            <p class="text-slate-400 text-sm line-clamp-2">${p.description}</p>
            <div class="flex flex-wrap gap-2 mt-3">
              ${p.tech_stack.split(',').slice(0,3).map(t =>
                `<span class="text-xs px-2 py-1 rounded bg-cyan-400/10 text-cyan-300">${t.trim()}</span>`
              ).join('')}
            </div>
          </div>
        </a>
      `).join('');

      if (window.gsap && window.ScrollTrigger) {
        ScrollTrigger.refresh();
        gsap.from('#featured > *', { y: 30, opacity: 0, duration: 0.7, stagger: 0.12, ease: 'power3.out' });
      }
    })();
  </script>
</body>
</html>

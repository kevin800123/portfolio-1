<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品集 | Kevin Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <link rel="stylesheet" href="css/performance.css" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <nav class="fixed top-0 inset-x-0 z-50 bg-slate-900/70 backdrop-blur-md border-b border-white/5">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="text-xl font-bold grad-text">Kevin.dev</a>
      <button id="navToggle" class="md:hidden text-slate-300 text-2xl btn" aria-label="選單">☰</button>
      <div class="hidden md:flex gap-6 text-sm">
        <a href="index.html" class="hover:text-cyan-400 transition">首頁</a>
        <a href="projects.html" class="text-cyan-400 font-semibold">作品集</a>
        <a href="about.html" class="hover:text-cyan-400 transition">關於我</a>
        <a href="contact.html" class="hover:text-cyan-400 transition">聯絡我</a>
        <a href="login.html" class="hover:text-cyan-400 transition">登入</a>
      </div>
    </div>
    <div id="navMobile" class="md:hidden hidden border-t border-white/5 bg-slate-900/95">
      <div class="px-6 py-4 flex flex-col gap-3 text-sm">
        <a href="index.html">首頁</a>
        <a href="projects.html" class="text-cyan-400">作品集</a>
        <a href="about.html">關於我</a>
        <a href="contact.html">聯絡我</a>
        <a href="login.html">登入</a>
      </div>
    </div>
  </nav>

  <main class="pt-32 pb-24 px-6 max-w-6xl mx-auto">
    <header class="text-center mb-16 fade-up">
      <h1 class="text-4xl md:text-6xl font-bold grad-text">所有作品</h1>
      <p class="text-slate-400 mt-4 max-w-xl mx-auto">
        每件作品代表我在某段時間嘗試解決的問題。從前端互動到後端架構，每個案子都教會了我一些新事物。
      </p>
    </header>

    <div id="projects" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      <div class="text-slate-500 text-center col-span-full py-20">載入中…</div>
    </div>
  </main>

  <footer class="border-t border-white/5 py-10 text-center text-slate-400 text-sm">
    <div class="flex justify-center gap-6 mb-4">
      <a href="https://github.com" class="hover:text-cyan-400">GitHub</a>
      <a href="https://linkedin.com" class="hover:text-cyan-400">LinkedIn</a>
    </div>
    <p>© 2026 Kevin Portfolio. All rights reserved.</p>
  </footer>

  <script src="js/common.js"></script>
  <script>
    (async () => {
      const wrap = document.getElementById('projects');
      const json = await apiGet('/api/projects');
      if (!json.success || !Array.isArray(json.data)) {
        wrap.innerHTML = `<div class="text-rose-300 text-center col-span-full py-12">${json.message || '無法載入作品'}</div>`;
        return;
      }
      if (!json.data.length) {
        wrap.innerHTML = '<div class="text-slate-500 text-center col-span-full py-12">目前還沒有作品</div>';
        return;
      }

      wrap.innerHTML = json.data.map(p => `
        <article class="project-card glass card-hover rounded-xl overflow-hidden flex flex-col">
          ${p.image_url ? `<img src="${p.image_url}" alt="${p.title}" loading="lazy" class="aspect-video object-cover">` : ''}
          <div class="p-6 flex flex-col flex-1">
            <h3 class="font-bold text-xl mb-2">${p.title}</h3>
            <p class="text-slate-400 text-sm flex-1">${p.description}</p>
            <div class="flex flex-wrap gap-2 my-4">
              ${p.tech_stack.split(',').map(t =>
                `<span class="text-xs px-2 py-1 rounded bg-cyan-400/10 text-cyan-300">${t.trim()}</span>`
              ).join('')}
            </div>
            <div class="flex gap-3 mt-auto pt-3 border-t border-white/5">
              ${p.demo_url ? `<a href="${p.demo_url}" target="_blank" class="text-sm text-cyan-400 hover:underline">Demo →</a>` : ''}
              ${p.github_url ? `<a href="${p.github_url}" target="_blank" class="text-sm text-slate-300 hover:text-white">GitHub →</a>` : ''}
            </div>
          </div>
        </article>
      `).join('');

      if (window.gsap && window.ScrollTrigger) {
        ScrollTrigger.getAll().forEach(t => t.kill());
        gsap.from('.project-card', {
          y: 40, opacity: 0, duration: 0.8, ease: 'power3.out', stagger: 0.1,
          scrollTrigger: { trigger: '#projects', start: 'top 85%' }
        });
        ScrollTrigger.refresh();
      }
    })();
  </script>
</body>
</html>

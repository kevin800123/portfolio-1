<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品管理 | 後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/auth.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <aside class="fixed inset-y-0 left-0 w-64 bg-slate-950 border-r border-white/5 p-6 flex flex-col">
    <div class="mb-8">
      <h1 class="text-xl font-bold">⚙️ 後台管理</h1>
      <p class="text-xs text-slate-500 mt-1">@<span id="hello">admin</span></p>
    </div>
    <nav class="flex flex-col gap-1 text-sm flex-1">
      <a href="dashboard.html" class="px-3 py-2 rounded hover:bg-white/5 transition">📊 儀表板</a>
      <a href="projects.html"  class="px-3 py-2 rounded bg-cyan-500/10 text-cyan-400 border-l-2 border-cyan-400">💼 作品管理</a>
      <a href="messages.html"  class="px-3 py-2 rounded hover:bg-white/5 transition">✉️ 留言管理</a>
      <a href="profile.html"   class="px-3 py-2 rounded hover:bg-white/5 transition">👤 個人資料</a>
    </nav>
    <button onclick="logout()" class="text-left px-3 py-2 rounded text-rose-300 hover:bg-rose-500/10 transition">🚪 登出</button>
  </aside>

  <main class="ml-64 p-8">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h2 class="text-3xl font-bold">作品管理</h2>
        <p class="text-slate-400 mt-1">新增、編輯、刪除你的代表作</p>
      </div>
      <button onclick="openModal()" class="px-5 py-2.5 rounded-lg bg-gradient-to-r from-cyan-500 to-violet-500 font-semibold hover:shadow-lg hover:shadow-cyan-500/30 transition">
        + 新增作品
      </button>
    </div>

    <div class="bg-white/5 border border-white/10 rounded-xl overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-white/5 text-left text-slate-400">
          <tr>
            <th class="py-3 px-4">標題</th>
            <th class="py-3 px-4">技術</th>
            <th class="py-3 px-4">建立日期</th>
            <th class="py-3 px-4 text-right">操作</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="4" class="py-8 text-center text-slate-500">載入中…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 z-40 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-white/10 rounded-xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
      <h3 id="modalTitle" class="text-xl font-bold mb-5">新增作品</h3>
      <form id="modalForm" class="space-y-4 text-sm">
        <input type="hidden" name="id" />
        <div>
          <label class="block text-slate-300 mb-1">標題 *</label>
          <input name="title" required class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded focus:border-cyan-400 focus:outline-none" />
        </div>
        <div>
          <label class="block text-slate-300 mb-1">描述 *</label>
          <textarea name="description" required rows="3" class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded focus:border-cyan-400 focus:outline-none resize-none"></textarea>
        </div>
        <div>
          <label class="block text-slate-300 mb-1">技術（逗號分隔）*</label>
          <input name="tech_stack" required placeholder="React, TypeScript, Node.js" class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded focus:border-cyan-400 focus:outline-none" />
        </div>
        <div>
          <label class="block text-slate-300 mb-1">圖片網址</label>
          <input name="image_url" class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded focus:border-cyan-400 focus:outline-none" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 mb-1">Demo 連結</label>
            <input name="demo_url" class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded focus:border-cyan-400 focus:outline-none" />
          </div>
          <div>
            <label class="block text-slate-300 mb-1">GitHub 連結</label>
            <input name="github_url" class="w-full px-3 py-2 bg-white/5 border border-white/10 rounded focus:border-cyan-400 focus:outline-none" />
          </div>
        </div>
        <div class="flex justify-end gap-2 pt-3 border-t border-white/5">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded bg-white/5 hover:bg-white/10 transition">取消</button>
          <button type="submit" class="px-4 py-2 rounded bg-cyan-500 hover:bg-cyan-400 font-semibold transition">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="fixed top-6 right-6 z-50 space-y-2"></div>

  <script>
    checkAuth();
    document.getElementById('hello').textContent = localStorage.getItem('username') || 'admin';

    let editingId = null;

    function openModal(item) {
      editingId = item?.id || null;
      const form = document.getElementById('modalForm');
      form.reset();
      document.getElementById('modalTitle').textContent = item ? '編輯作品' : '新增作品';
      if (item) {
        for (const k of ['title', 'description', 'tech_stack', 'image_url', 'demo_url', 'github_url']) {
          if (form[k]) form[k].value = item[k] ?? '';
        }
      }
      document.getElementById('modal').classList.remove('hidden');
    }
    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      editingId = null;
    }
    window.openModal = openModal;
    window.closeModal = closeModal;

    async function loadList() {
      const tbody = document.getElementById('tbody');
      try {
        const res = await authFetch(API_BASE + '/api/projects');
        const json = await res.json();
        if (!json.success) { tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-rose-300">${json.message}</td></tr>`; return; }
        if (!json.data.length) { tbody.innerHTML = '<tr><td colspan="4" class="py-8 text-center text-slate-500">尚無作品，點右上角「新增作品」</td></tr>'; return; }
        tbody.innerHTML = json.data.map(p => `
          <tr class="border-t border-white/5 hover:bg-white/5 transition">
            <td class="py-3 px-4 font-medium">${escapeHtml(p.title)}</td>
            <td class="py-3 px-4 text-slate-400 text-xs">${escapeHtml(p.tech_stack)}</td>
            <td class="py-3 px-4 text-slate-500 text-xs">${(p.created_at || '').slice(0,10)}</td>
            <td class="py-3 px-4 text-right">
              <button data-edit='${encodeURIComponent(JSON.stringify(p))}' class="text-cyan-400 hover:underline mr-3">編輯</button>
              <button data-del="${p.id}" class="text-rose-300 hover:underline">刪除</button>
            </td>
          </tr>`).join('');

        tbody.querySelectorAll('[data-edit]').forEach(btn => {
          btn.addEventListener('click', () => openModal(JSON.parse(decodeURIComponent(btn.dataset.edit))));
        });
        tbody.querySelectorAll('[data-del]').forEach(btn => {
          btn.addEventListener('click', () => deleteItem(parseInt(btn.dataset.del, 10)));
        });
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="4" class="py-8 text-center text-rose-300">${e.message}</td></tr>`;
      }
    }

    document.getElementById('modalForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const data = {
        title: f.title.value.trim(),
        description: f.description.value.trim(),
        tech_stack: f.tech_stack.value.trim(),
        image_url: f.image_url.value.trim() || null,
        demo_url: f.demo_url.value.trim() || null,
        github_url: f.github_url.value.trim() || null,
      };
      const url = API_BASE + '/api/projects' + (editingId ? '/' + editingId : '');
      const method = editingId ? 'PUT' : 'POST';
      try {
        const res = await authFetch(url, { method, body: JSON.stringify(data) });
        const json = await res.json();
        if (json.success) { toast(json.message || '已儲存'); closeModal(); loadList(); }
        else toast((json.detail?.message) || json.message || '儲存失敗', 'error');
      } catch (err) { toast(err.message, 'error'); }
    });

    async function deleteItem(id) {
      if (!confirm('確定刪除這個作品？')) return;
      try {
        const res = await authFetch(API_BASE + '/api/projects/' + id, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) { toast(json.message || '已刪除'); loadList(); }
        else toast(json.message || '刪除失敗', 'error');
      } catch (err) { toast(err.message, 'error'); }
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    loadList();
  </script>
</body>
</html>
